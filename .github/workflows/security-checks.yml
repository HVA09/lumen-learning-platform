name: Security branch checks

on:
  push:
    branches:
      - fix/security-initial-admin
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/security-checks.yml"
  pull_request:
    branches:
      - chore/import-initial-source
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/security-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_backend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DEBUG: "false"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_backend_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_backend_test
      JWT_SECRET_KEY: test-only-secret-not-for-deployment
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest -q

  frontend-checks:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
