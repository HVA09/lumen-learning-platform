name: Generate frontend lockfile artifact

on:
  push:
    branches:
      - chore/frontend-lockfile-reproducibility
    paths:
      - "frontend/package.json"
      - ".github/workflows/lockfile-artifact.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "frontend/package.json"
      - ".github/workflows/lockfile-artifact.yml"

permissions:
  contents: write

jobs:
  generate:
    name: Resolve exact frontend dependency graph
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate npm lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Stage generated lockfile
        run: |
          mkdir -p ../lockfile-artifact
          cp package-lock.json ../lockfile-artifact/package-lock.json
      - name: Upload lockfile artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: lockfile-artifact/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Commit generated lockfile on branch push
        if: github.event_name == 'push'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(frontend): add npm dependency lockfile"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
