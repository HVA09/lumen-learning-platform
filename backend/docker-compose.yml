services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      clamav:
        # The official image exposes a Docker health check for the clamd PING/PONG protocol.
        condition: service_healthy
    environment:
      MALWARE_SCAN_ENABLED: ${MALWARE_SCAN_ENABLED:-true}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-30}
      MAX_USER_STORAGE_MB: ${MAX_USER_STORAGE_MB:-100}
      MAX_USER_FILES: ${MAX_USER_FILES:-100}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/app/uploads

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Internal malware scanner. Port 3310 is deliberately not published to the host.
  clamav:
    # The _base image is intended for a persistent signature volume.
    image: clamav/clamav:stable_base
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav

  celery_worker:
    build: .
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # يشغّل المهام المجدولة (ملخص أسبوعي، تذكير بطاقات مستحقة) — راجع beat_schedule بـ app/tasks.py
  celery_beat:
    build: .
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - app

  # يجدّد شهادة SSL تلقائيًا كل 12 ساعة (يتأكد إذا قربت تنتهي فقط).
  # الحصول على الشهادة الأولى يصير يدويًا مرة وحدة — خطوات كاملة بـ README
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"

  # نسخة احتياطية يومية لقاعدة البيانات — تُحفظ بمجلد ./backups (آخر 7 أيام فقط)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "-c", "while true; do sh /scripts/backup.sh; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  certbot_conf:
  certbot_www:
  clamav_db:
