events {}

http {
    # Map HTTP Upgrade headers to the Connection value required by WebSocket.
    # Ordinary HTTP requests receive "close"; upgraded requests receive "upgrade".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Protect login and API requests from simple request bursts.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    # 10 MB upload plus multipart overhead. Keep in sync with MAX_UPLOAD_SIZE_MB.
    client_max_body_size 12m;

    upstream fastapi_app {
        server app:8000;
    }

    # HTTP remains available for ACME HTTP-01 validation and local development.
    # The HTTPS server below is intentionally disabled until a real certificate exists.
    server {
        listen 80;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        include /etc/nginx/snippets/lumen-locations.conf;
    }

    # Enable only after issuing a certificate for the real domain:
    # 1. Replace your-domain.com in server_name and both certificate paths.
    # 2. Obtain the first certificate with the certbot command in backend/README.md.
    # 3. Uncomment this server block and the HTTP redirect block below.
    # 4. Run: docker compose exec nginx nginx -t
    # 5. Run: docker compose restart nginx
    #
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     ssl_session_tickets off;
    #
    #     include /etc/nginx/snippets/lumen-locations.conf;
    # }
    #
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #
    #     location ^~ /.well-known/acme-challenge/ {
    #         root /var/www/certbot;
    #     }
    #
    #     location / {
    #         return 301 https://$host$request_uri;
    #     }
    # }
}
