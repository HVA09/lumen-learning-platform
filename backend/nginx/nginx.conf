events {}

http {
    # حماية بسيطة من محاولات تسجيل الدخول المتكررة (brute force)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    # حد عام أوسع لبقية الـ API (حماية من إساءة الاستخدام العامة)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    upstream fastapi_app {
        server app:8000;
    }

    server {
        listen 80;
        server_name _;

        # Allow the 10 MB application upload limit plus multipart request overhead.
        # Keep this in sync with MAX_UPLOAD_SIZE_MB in backend/app/config.py.
        client_max_body_size 12m;

        # مطلوب لتفعيل HTTPS عبر Certbot (تحدّي webroot) — راجع README لخطوات الحصول على الشهادة
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /auth/ {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://fastapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://fastapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # فعّل هذا الجزء بعد ما تحصل على شهادة SSL (خطوات كاملة بـ README):
    # 1. استبدل your-domain.com بدومينك الحقيقي في السطرين أدناه
    # 2. شغّل: docker compose up -d nginx
    # 3. شغّل أمر الحصول على الشهادة لأول مرة (موجود بالـ README)
    # 4. ألغِ التعليق عن هذا الجزء بالكامل وأعد تشغيل nginx: docker compose restart nginx
    #
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    #
    #     location /auth/ {
    #         limit_req zone=auth_limit burst=3 nodelay;
    #         proxy_pass http://fastapi_app;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    #
    #     location / {
    #         limit_req zone=api_limit burst=20 nodelay;
    #         proxy_pass http://fastapi_app;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }
    #
    # # يحوّل كل زيارة HTTP لـ HTTPS تلقائيًا (فعّله بعد ما تتأكد HTTPS شغّال تمام)
    # server {
    #     listen 80;
