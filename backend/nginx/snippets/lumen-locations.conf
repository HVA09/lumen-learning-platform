# Shared by the HTTP and HTTPS virtual hosts.
# Keep WebSocket-specific proxy settings in this exact location so the
# notification socket cannot fall through to the ordinary API proxy.
location ^~ /ws/ {
    limit_req zone=api_limit burst=20 nodelay;

    proxy_pass http://fastapi_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Notifications are event-driven and may be idle for a long time.
    # The frontend already reconnects if a long-lived socket is closed.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location /auth/ {
    limit_req zone=auth_limit burst=3 nodelay;
    proxy_pass http://fastapi_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass http://fastapi_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
